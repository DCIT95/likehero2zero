<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Like Hero To Zero - Login</title>
</h:head>
<h:body>
    <h2>Wissenschaftler-Login</h2>

    <h:form id="loginForm">
        <h:panelGrid columns="2">
            <h:outputLabel value="Benutzername:" />
            <h:inputText value="#{loginBean.username}" required="true" />

            <h:outputLabel value="Passwort:" />
            <h:inputSecret value="#{loginBean.password}" required="true" />

            <h:commandButton value="Anmelden" action="#{loginBean.login}" />
        </h:panelGrid>
        <h:messages style="color: red;" />
    </h:form>

    <br/>
    <h:link outcome="index.xhtml" value="Zurück zur öffentlichen Suche" />
</h:body>
</html>
