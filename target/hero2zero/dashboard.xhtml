<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Scientist Dashboard - Data Entry</title>
</h:head>
<h:body>
    <h2>Wissenschaftler-Dashboard: Neue Daten erfassen</h2>

    <p>Angemeldet als: <strong>#{loginBean.currentUser.username}</strong></p>
    
    <h:form id="logoutForm">
        <h:commandButton value="Abmelden" action="#{loginBean.logout}" />
    </h:form>

    <br/>

    <h:form id="dataForm">
        <h:panelGrid columns="2">
            <h:outputLabel value="Land Name:" />
            <h:inputText value="#{scientistDashboardBean.countryName}" required="true" />

            <h:outputLabel value="Land Code (3 Kürzel):" />
            <h:inputText value="#{scientistDashboardBean.countryCode}" required="true" />

            <h:outputLabel value="Jahr:" />
            <h:inputText value="#{scientistDashboardBean.year}" required="true" />

            <h:outputLabel value="CO2 Ausstoß (in kt):" />
            <h:inputText value="#{scientistDashboardBean.co2Emissions}" required="true" />

            <h:commandButton value="Datensatz Speichern" action="#{scientistDashboardBean.saveNewData}" />
        </h:panelGrid>
    </h:form>

    <h:messages style="color: red;" />

    <h:panelGroup rendered="#{not empty scientistDashboardBean.successMessage}">
        <p style="color: green; font-weight: bold;">#{scientistDashboardBean.successMessage}</p>
    </h:panelGroup>

    <br/>
    <h:link outcome="index.xhtml" value="Zurück zur Suche" />
</h:body>
</html>
